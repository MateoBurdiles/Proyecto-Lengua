<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El tonel de amontillado - Edición Definitiva</title>
<style>
:root{--bg:#150f0d;--fg:#f4ebd0;--pn:#241a16;--ac:#c0392b;--mu:#b39d80;--bd:#4a3a2c;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120c08;--fg:#f4ebd0;--pn:#1f1610;--ac:#e0553f;--mu:#b39d80;--bd:#4a3a2c}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
#app{width:min(100%,600px);margin:0 auto;padding:12px 14px 30px;box-sizing:border-box}
h1{font-size:21px;margin:6px 0 8px;font-style:italic;letter-spacing:.5px;text-align:center;color:#e6cca6;text-shadow:0 2px 4px rgba(0,0,0,0.5)}
#hud{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:10px;flex-wrap:wrap}
#hud span{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:4px 10px;box-shadow:inset 0 1px 3px rgba(0,0,0,0.3)}
#st{border:3px solid var(--bd);border-radius:10px;overflow:hidden;background:#050302;box-shadow:0 8px 24px rgba(0,0,0,0.6);line-height:0}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
svg text{font-family:Georgia,serif}
.h{cursor:pointer;transition:transform .15s ease}.h:hover{filter:brightness(1.2)}.h:active{opacity:.7}
#tx{margin:14px 0 12px;font-size:16px;line-height:1.6;min-height:80px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;box-shadow:inset 0 1px 4px rgba(0,0,0,0.2)}
#bt{display:flex;flex-direction:column;gap:8px}
button{font:inherit;font-size:15px;padding:12px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--pn);color:var(--fg);text-align:left;cursor:pointer;min-height:48px;touch-action:manipulation;box-shadow:0 3px 6px rgba(0,0,0,0.3);transition:all .2s ease}
button:hover{border-color:var(--ac);background:#2f2219}
button:active{background:var(--ac);color:#fff;transform:translateY(1px)}
button:disabled{opacity:.4;border-color:var(--bd);cursor:not-allowed}
#hud button{padding:4px 12px;text-align:center;background:#3a291c}
#lg{display:none;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin-top:10px;font-size:14px;line-height:1.6;box-shadow:0 6px 16px rgba(0,0,0,0.4)}
@keyframes pop{0%{transform:scale(.7) translateY(-16px);opacity:.3}55%{transform:scale(1.1) translateY(2px)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes spark{0%{opacity:1;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-46px) scale(1.4)}}
.an{transform-box:fill-box;transform-origin:50% 100%}.sp{transform-origin:50% 50%;animation:spark .9s ease-out both}
.f_ok{animation:pop .45s ease-out}.f_bad{animation:shake .4s}.f_lucky{animation:pop .5s ease-out;filter:drop-shadow(0 0 6px #ffd966)}
#st{position:relative}
@keyframes sin{from{opacity:0;transform:scale(1.07);filter:brightness(2.2) blur(2px)}to{opacity:1;transform:none;filter:none}}
@keyframes cv{from{opacity:1}to{opacity:0}}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-16px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
@keyframes tn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(345px) rotate(360deg)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-130px);opacity:0}}
.sin{animation:sin .55s ease-out}.cv{position:absolute;inset:0;background:#000;animation:cv .6s ease-out both;pointer-events:none}
.bn{position:absolute;left:50%;top:10px;background:rgba(10,6,4,.82);border:1px solid #c9a063;border-radius:10px;padding:6px 16px;text-align:center;line-height:1.35;color:#f4ebd0;white-space:nowrap;animation:bn 2.4s ease both;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.bn b{display:block;font-size:15px;color:#e8a317}.bn small{font-size:11px;color:#c9b48a;font-style:italic}
.tn{animation:tn .5s ease-out}.cf,.em{transform-box:fill-box;transform-origin:center;animation:fall 4s linear infinite}.em{animation-name:rise}
</style>
</head>
<body>
<div id="app">
  <h1>El tonel de amontillado / The Cask of Amontillado</h1>
  <div id="hud"></div>
  <div id="st"></div>
  <div id="tx"></div>
  <div id="bt"></div>
  <div id="lg"></div>
</div>

<script>
let S,seen=[],lastK=null;try{seen=JSON.parse(localStorage.getItem('tonel_v5')||'[]')}catch(e){}
const $=i=>document.getElementById(i);
const R=s=>{
  const sc=S?S.sc:null;
  const k=sc+(sc=='f_lamp'?S.ls:'')+(sc=='f_event'?S.evIndex:'')+(sc=='ct'?S.ph+(S.ph=='m'?S.m:''):'');
  const ch=k!==lastK;lastK=k;
  const b=ch?bn():null,ak=ambK();
  $('st').innerHTML='<svg viewBox="0 0 360 330"'+(ch?' class="sin"':'')+'>'+s+(ak?amb(ak):'')+'</svg>'+(ch?'<div class="cv"></div>'+(b?`<div class="bn"><b>${b[0]} ${b[1]}</b><small>${b[2]}</small></div>`:''):'');
  if(ch){const t=$('tx');t.classList.remove('tn');void t.offsetWidth;t.classList.add('tn')}
};
const T=t=>{$('tx').innerHTML=t};
const B=a=>{const b=$('bt');b.innerHTML='';a.forEach(([l,f,d])=>{const e=document.createElement('button');e.textContent=l;e.disabled=!!d;e.onclick=f;b.appendChild(e)})};
const hs=(id,x)=>`<g class="h" onclick="H('${id}')">${x}</g>`;
const H=id=>{const a=A[S.sc];a&&a(id)};

const F_prof={h:'#111',m:1,c:'#8e1b1b',v:'#d4a017'};
const C={
  card:['Reconocer a Fortunato / Find Fortunato','Plaza: búscalo con traje de bufón / Look for the jester'],
  luc:['Lucresi, rival en vinos / Wine rival Lucresi','Plaza: cartel de cata / Wine contest banner'],
  sirv:['Criados ausentes / Servants away','Palazzo: nota en pared / Note on wall'],
  plano:['Plano de catacumbas / Catacomb map','Palazzo: sobre la mesa / On table'],
  esc:['Escudo Montresor / Montresor crest','Palazzo: cuadro nobiliario / Crest painting'],
  sig:['Pala de albañil / Trowel sign','Cripta: seña masónica / Masonic sign'],
  ton:['Tonel verdadero / True cask','Cripta profunda / Deep crypt']
};

const END={
  sos:['Bufón descubierto / Jester escaped','Fortunato descubre la trampa y huye gritando. La guardia llama a tu puerta. No hubo impunidad.','#3a1111','🚨'],
  sp:['Sin herramientas / No tools','Llegas al nicho sin pala ni forma de sellarlo. Queda en ridículo tu venganza.','#1d2a3a','🧱'],
  pi:['Bufón piadoso / Merciful jester','Sueltas la piedra y lo liberas. En el próximo carnaval todos sabrán tu secreto.','#2c2a14','🎭'],
  ca:['Final clásico / Classic ending','Colocas la última piedra. Solo se oye el tintineo de unos cascabeles. ¡Requiescat in pace!','#1a1a2a','🔔'],
  ve:['Final perfecto / Perfect ending','Nadie vio nada, los criados se fueron y el amontillado era real. Brindas a solas.','#2a1a05','🍷'],
  f_free:['¡Libre bajo las estrellas! / Free under the stars!','Con ingenio, corazones y coronas saliste de la cripta. Montresor vuelve con las piedras y solo halla cascabeles y un nicho vacío. Al amanecer, toda Venecia sabrá la verdad.','#14304a','🌅'],
  enc:['Encerrado / Locked in','Fortunato lo supo todo desde el principio. En el fondo del nicho, quien oye alejarse los cascabeles eres tú. Requiescat in pace.','#1a1015','⛓️'],
  f_lost:['Perdido en la oscuridad / Lost in the dark','La linterna se apagó antes de hallar la salida. Los cascabeles se perdieron entre los arcos... y Montresor sellará el nicho al volver.','#101018','🕯️'],
  f_dead:['Atrapado en el muro / Trapped in the wall', 'Confiaste demasiado en las falsas promesas de amontillado de Montresor. Te encadenó al fondo del nicho y te construyó una tumba eterna de piedra.','#3a1111','🪦']
};

// Character drawing helpers
const FC=`<circle cx="-2.8" cy="1" r="1" fill="#222"/><circle cx="2.8" cy="1" r="1" fill="#222"/><path d="M-3 4.6Q0 7.6 3 4.6" stroke="#8e1b1b" fill="none" stroke-width=".9"/><circle cx="-5" cy="3.6" r="1.4" fill="#e88" opacity=".6"/><circle cx="5" cy="3.6" r="1.4" fill="#e88" opacity=".6"/>`;
const CL=[['#c0392b','#f4ebd0','#c0392b'],['#2f9e44','#f2d64b','#2f9e44'],['#1e6fd6','#f08a24','#f08a24'],['#222','#f4ebd0','#d63a8a'],['#18a6a6','#e8e8e8','#6b3fa0']];
const jest=(a,b,h)=>`<path d="M-8 12L-15 24M8 12L15 24" stroke="${a}" stroke-width="4.5" stroke-linecap="round"/><circle cx="-15" cy="25" r="2.4" fill="#f8e1c4"/><circle cx="15" cy="25" r="2.4" fill="#f8e1c4"/><path d="M-10 33L-8 8H8L10 33Z" fill="${a}" stroke="#0006"/><path d="M-10 33L-8 8H0L-2 20Z" fill="${b}"/><path d="M0 8H8L10 33H1Z" fill="${b}" opacity=".5"/><rect x="-8" y="33" width="7" height="3.5" rx="1.7" fill="#111"/><rect x="1" y="33" width="7" height="3.5" rx="1.7" fill="#111"/><path d="M-10 8Q0 15 10 8L8 5H-8Z" fill="#f4ebd0" stroke="#0004"/><circle cy="2" r="7.5" fill="#f8e1c4" stroke="#0005" stroke-width=".6"/><path d="M-9 -1L-15-14-5-6 0-18 5-6 15-14 9-1Z" fill="${h}"/><circle cx="-15" cy="-14" r="2.5" fill="#c00"/><circle cy="-18" r="2.5" fill="#c00"/><circle cx="15" cy="-14" r="2.5" fill="#c00"/>${FC}`;
function P(x,y,k,s,o){
  let g=`<g transform="translate(${x},${y}) scale(${s})"><ellipse cy="36" rx="14" ry="3" fill="#000" opacity=".35"/><rect x="-14" y="-18" width="28" height="52" fill="transparent"/>`;
  const F2=`<g transform="translate(0,1)">${FC}</g>`;
  if(k=='j')g+=jest('#7b2d8e','#e8a317',(typeof S!='undefined'&&S&&S.hat&&HATC[S.hat])||'#e8a317');
  else if(k.length==2&&k[0]=='c')g+=jest(...CL[+k[1]]);
  else if(k=='np1')g+=`<path d="M-8 12L-14 26M8 12L14 26" stroke="#1e3f8a" stroke-width="4.5" stroke-linecap="round"/><rect x="-9" y="8" width="18" height="24" rx="3" fill="#1e3f8a" stroke="#0006"/><path d="M-9 8L0 22 9 8Z" fill="#c9a063"/><rect x="-8" y="32" width="6" height="3" fill="#111"/><rect x="2" y="32" width="6" height="3" fill="#111"/><circle cy="3" r="7.5" fill="#f8e1c4"/><rect x="-8" y="-1" width="16" height="5" rx="2" fill="#111"/><circle cx="-3" cy="1.6" r="1.2" fill="#fff"/><circle cx="3" cy="1.6" r="1.2" fill="#fff"/><path d="M-8-3Q0-12 8-3Z" fill="#111"/><path d="M-3 7Q0 9 3 7" stroke="#8e1b1b" fill="none"/>`;
  else if(k=='np2')g+=`<path d="M-10 32L-12 10H12L10 32Z" fill="#2f9e44" stroke="#0006"/><path d="M-12 10Q0 18 12 10" fill="#f4ebd0"/><circle cy="3" r="7.5" fill="#f8e1c4"/><path d="M-6-4L0-16 6-4Z" fill="#e0553f"/><path d="M0-6Q10-22 4-26" stroke="#f4ebd0" stroke-width="2" fill="none"/>${F2}`;
  else if(k=='np3')g+=`<path d="M-11 33L-8 6H8L11 33Z" fill="#5a3a1e" stroke="#0006"/><path d="M-8 20H8" stroke="#c9a063" stroke-width="2"/><circle cy="4" r="7.5" fill="#f8e1c4"/><path d="M-10-3Q0-14 10-3L8 8H-8Z" fill="#3a2210"/><circle cy="4" r="6" fill="#f8e1c4"/>${F2}`;
  else g+=`<path d="M-8 12L-14 26M8 12L14 26" stroke="#1e1815" stroke-width="4.5" stroke-linecap="round"/><rect x="-9" y="8" width="18" height="24" rx="3" fill="#1e1815"/><rect x="-5" y="9" width="10" height="22" fill="${o.v}"/><path d="M-3 9H3L0 16Z" fill="${o.c}"/><circle cy="3" r="7.5" fill="#f8e1c4"/><rect x="-8.5" y="-13" width="17" height="13" fill="${o.h}"/><rect x="-11.5" y="-1" width="23" height="3" fill="${o.h}"/><circle cx="3" cy="3" r="3" fill="none" stroke="#d4a017" stroke-width="1.2"/>${F2}`;
  return g+'</g>';
}

const tx=(x,y,t,sz,c,w)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${sz}" fill="${c}"${w?' font-weight="700"':''}>${t}</text>`;

function card(x,nm,ls,k,id){
  let g=`<g transform="translate(${x},12)"><rect width="150" height="286" rx="12" fill="#241a14" stroke="#c9a063" stroke-width="3" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.5))"/>`;
  g+=`<rect x="10" y="10" width="130" height="170" rx="8" fill="#150f0c" stroke="#5c4028" stroke-width="1"/>`;
  g+=P(75,95,k,3.4,F_prof);
  g+=tx(75,208,nm,16,'#f4ebd0',1);
  ls.forEach((l,i)=>g+=tx(75,228+i*15,l,10,'#c9b48a'));
  if(id){g+=tx(75,272,'👆 Toca para jugar',10,'#e8a317',1);return hs(id,g+'</g>')}
  return g+'</g>';
}

function hud(){
  if(S.char === 'montresor'){
    $('hud').innerHTML=`<span>🔎 Pistas: ${S.cl.size}/7</span><span>👁 Sospecha: ${'●'.repeat(S.su)}${'○'.repeat(3-S.su)}</span><span>🔦 ${S.it.t?'✓':'–'} 🧱 ${S.it.p?'✓':'–'}</span><button onclick="nb()">📓 Pistas</button>`;
  } else if(!S.char){$('hud').innerHTML=''}
  else {
    const L=Math.max(0,S.lives||0);
    $('hud').innerHTML=`<span>❤️ ${'❤️'.repeat(L)}${'🖤'.repeat(3-L)}</span><span>👑 ${S.crowns||0}/5</span>${S.bat!=null?`<span>🔦 ${S.bat}s</span>`:''}<span>🏁 ≥2❤️ y ≥5👑</span>`;
  }
}

function nb(){
  const l=$('lg');
  if(l.style.display=='block'){l.style.display='none';return}
  l.innerHTML='<b>📓 Cuaderno de Pistas / Clues Journal</b><br><br>'+Object.keys(C).map(k=>S.cl.has(k)?`✅ <b>${C[k][0]}</b><br><small>${S.det[k]}</small>`:`❔ <i>${C[k][0]}</i><br><small>${C[k][1]}</small>`).join('<br><br>');
  l.style.display='block';
}

function cl(k,m){S.cl.add(k);S.det[k]=m;hud();T(`🔎 <b>¡Pista descubierta!</b><br>${m}`)}
function sus(m){if(S.su<3)S.su++;hud();if(S.su>=3&&!S.trap){S.trap=1;T(`${m} <span style="color:#e0553f"><b>¡Sospecha máxima!</b></span> Fortunato ya no se fía de ti, pero sigues adelante... Algo saldrá mal al final.`);return 0}T(`${m} <span style="color:#e0553f"><b>Sospecha: ${S.su}/3.</b></span>`);return 0}
const rn=(i,m)=>Math.floor((((Math.sin(i*12.9898+S.sd*78.233)*43758.5453)%1)+1)%1*m);
const nm=['izquierda','centro','derecha'];

function intro(){
  clearInterval(RT);clearInterval(WT);clearInterval(LT);
  S={char:null,cl:new Set(),det:{},it:{t:0,p:0},su:0,sd:Math.random()*100,fi:Math.floor(Math.random()*24),path:[0,1,2].map(()=>Math.floor(Math.random()*3)),so:[0,1,2].sort(()=>Math.random()-.5),w:0,m:0,row:0,sc:'intro'};
  hud();$('lg').style.display='none';
  R('<rect width="360" height="330" fill="#16100c"/>'+card(15,'FORTUNATO',['Bufón del carnaval','Gorro cascabeles','Traje rombos'],'j','cF')+card(195,'MONTRESOR',['Burgués de clase alta','Sombrero copa','Monóculo'],'f','cM'));
  T('👆 <i>Toca la imagen de un personaje para empezar.</i><br><br><b>Elige tu personaje / Choose your character:</b><br><br>🇪🇸 <b>Montresor (Clásico):</b> Vengarte de Fortunato, busca pistas en la plaza y el palazzo, desciende a las catacumbas y séllalo.<br><br>🇬🇧 <b>Fortunato (Modo Historia Interactiva + Supervivencia):</b> ¡Vistete para el carnaval, esquiva gente en las calles de Venecia, reúne coronas y sobrevive a los engaños de Montresor!');
  B([
    ['🇪🇸 Jugar como Montresor (Clásico)', ()=>setChar('montresor')],
    ['🎭 Jugar como Fortunato (Historia + Supervivencia)', ()=>setChar('fortunato')]
  ]);
}

function setChar(c){
  S.char=c;
  if(c==='montresor'){introMontresor();}
  else{introFortunatoStory();0}
}

// ---------------- MONTRESOR PATH ----------------
function introMontresor(){
  S.sc='in';hud();
  R('<rect width="360" height="330" fill="#16100c"/>'+card(15,'FORTUNATO',['Bufón del carnaval','Gorro cascabeles','Traje rombos'],'j')+card(195,'MONTRESOR',['Burgués orgulloso','Sombrero copa','Monóculo'],'f'));
  T('<b>Carnaval en Venecia.</b><br>Juraste venganza contra Fortunato. Encuéntralo en la plaza (ahora con personajes claramente diferenciados por trajes y colores), reúne las <b>7 pistas</b> y castígalo.');
  B([['Comenzar búsqueda',plaza]]);
}

function plaza(){
  S.sc='pl';S.found=0;
  let s=bgCarn();
  for(let i=0;i<24;i++){
    const x=36+(i%6)*57+((i*37)%13)-6,y=62+Math.floor(i/6)*55+((i*53)%9)-4;
    let k='np1',o=F_prof;
    if(i==S.fi){
      k='j'; // Fortunato is distinctive with purple/gold jester suit and bell hat
    } else {
      const type=rn(i,8);k=type<3?['np1','np2','np3'][type]:'c'+(type-3);
    }
    s+=hs('f'+i,P(x,y,k,1.05,o));
  }
  s+='<rect x="8" y="260" width="154" height="64" rx="8" fill="#241a14" stroke="#c9a063" stroke-width="2"/>'+P(36,292,'j',1.2,F_prof)+tx(105,282,'BUSCA AL BUFÓN',10.5,'#f4ebd0',1)+tx(105,298,'Fortunato',12,'#e8a317',1)+tx(105,312,'(traje morado y cascabeles)',7.5,'#c9b48a');
  s+=hs('pos','<rect x="218" y="260" width="134" height="64" rx="6" fill="#241a14" stroke="#c9a063" stroke-width="2"/>'+tx(285,283,'LUCRESI',14,'#e0553f',1)+tx(285,300,'Rivales en vino',9.5,'#f4ebd0')+tx(285,314,'🍷 Toca cartel',9,'#c9b48a'));
  R(s);
  T('<b>Plaza de carnaval:</b> ¡Hay bufones de todos los colores! Busca al de <b>traje morado y dorado</b> con cascabeles rojos, o toca el cartel de Lucresi.');
  B([]);
}

const A={
  intro:id=>{if(id=='cM')setChar('montresor');else if(id=='cF')setChar('fortunato')},
  mu:()=>{if(S.row<10)hil()},
  pl:id=>{
    if(id=='pos'){cl('luc','Lucresi es su rival en vinos.');return}
    const i=+id.slice(1);if(S.found){if(i==S.fi)dialogo();return}
    if(i==S.fi){S.found=1;cl('card','¡Fortunato encontrado! Tócalo de nuevo para acercarte.');B([['Acercarse a Fortunato',dialogo]])}
    else sus('Ese no es Fortunato: es otro enmascarado.')
  },
  pz:id=>{
    const m={
      t:()=>{S.it.t=2;hud();T('Has tomado antorchas.')},
      pa:()=>{S.it.p=1;hud();T('Has guardado la pala de albañil.')},
      n:()=>cl('sirv','Nota: «Nos fuimos al carnaval».'),
      pl:()=>cl('plano','Catacumbas: 1.º '+nm[S.path[0]]+', 2.º '+nm[S.path[1]]+', 3.º '+nm[S.path[2]]+'.'),
      es:()=>cl('esc','Escudo: pie humano aplastando serpiente.')
    };
    if(id=='door'){descend();return}m[id]&&m[id]();if(id=='n'||id=='pl'){docView(id);return}pzd();
  },
  ct:id=>{
    const p=S.ph;
    if(p=='w'){
      const ok=S.w==0?0:2;
      if(id=='b'+ok){
        if(S.w==0){S.w=1;wine('Brindan. Fortunato pide De Grâve.')}
        else arms()
      } else sus('Esa botella no es la correcta.')
    }
    else if(p=='a'){
      if(S.so[+id[1]]==0){T('Fortunato asiente. Falta el lema.');S.ph='x';B(['Memento mori','Nemo me impune lacessit','Veni, vidi, vici'].sort(()=>Math.random()-.5).map(l=>[l,()=>{if(l[0]=='N'){sign()}else sus('Ese no es el lema.')}]))}
      else sus('Escudo incorrecto.')
    }
    else if(p=='m'){
      if(+id[1]==S.path[S.m]){S.m++;if(S.m==3)deep();else maze()}
      else sus('Te desviaste en los oscuros arcos.')
    }
    else if(p=='d'){
